worker_processes auto;
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Реальный IP клиента. Перед nginx стоит Caddy на хосте, запросы приходят
    # через docker-proxy с адреса моста — без real_ip все лимиты ниже считали
    # бы весь мир одним клиентом, а в логах стоял бы 172.18.0.1.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    limit_req_status 429;
    limit_conn_status 429;

    # Ограничитель для ботов (работает по UA — см. map ниже)
    map $http_user_agent $is_bot {
        default 0;
        ~*(ClaudeBot|GPTBot|Claude-SearchBot|Applebot|YandexBot|Amazonbot|Bytespider|SemrushBot|DataForSeoBot|Googlebot) 1;
    }
    map $is_bot $bot_key {
        1 $binary_remote_addr;
        0 "";
    }
    limit_req_zone $bot_key zone=bots:10m rate=5r/s;

    # Раздел дискографии выкачивают распределённым скрапером: 1736 уникальных
    # IP на 1757 запросов, UA обычного браузера, статику не грузят. Ни лимит на
    # IP, ни на подсеть такое не ловит (топ-20 /16 — 8% трафика), остаётся
    # ОБЩИЙ потолок на раздел.
    #
    # Но общий потолок бьёт и по живым посетителям. Разделяем их по признаку,
    # которого у выкачки нет: она ходит одиночными запросами и не хранит
    # cookie, а браузер, единожды открывший любую страницу, приносит mzs=1
    # (её ставит location / ниже). С cookie ключ лимита пустой — nginx такие
    # запросы не учитывает и пропускает мимо потолка.
    map $cookie_mzs $disco_limit_key {
        "1"     "";
        default $server_name;
    }
    limit_req_zone $disco_limit_key zone=disco_all:1m rate=25r/s;
    limit_req_zone $binary_remote_addr zone=perip:10m rate=5r/s;
    # Nuxt — один Node-процесс на реплику: незакрытая очередь SSR-запросов
    # выедает heap и роняет контейнер по OOM. Ограничиваем одновременные
    # запросы: nuxtconn — общий потолок на весь сайт, disco_conn — узкий и
    # только для клиентов без cookie mzs (тот же признак «живого браузера»,
    # что и у disco_all: без него потолок соединений душил живых наравне
    # с выкачкой, даже когда лимит запросов их уже пропускал).
    limit_conn_zone $server_name zone=nuxtconn:1m;
    limit_conn_zone $disco_limit_key zone=disco_conn:1m;

    # Встроенный DNS Docker. resolver + переменная в proxy_pass — заставляют
    # nginx ре-резолвить upstream (вместо одноразового резолва при старте);
    # без этого после recreate любого из контейнеров (nuxt/main-web/discogs-web/
    # reverb) edge продолжает ходить на старый IP, который мог достаться
    # другому контейнеру → Bad Gateway или ответы от чужого сервиса.
    # valid=2s, а не 10s: при нескольких репликах nuxt встроенный DNS Docker
    # отдаёт записи в разном порядке, и частый перерезолв — единственный
    # доступный в OSS-nginx способ размазать нагрузку по репликам
    # (proxy_pass через переменную берёт первый адрес из ответа).
    resolver 127.0.0.11 valid=2s ipv6=off;

    # Connection для проксирования WebSocket: "upgrade" только когда клиент
    # действительно просит апгрейд. Жёстко зашитый "upgrade" на обычном GET
    # роняет соединение с апстримом и отдаёт 502.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Health check для мониторинга и Caddy
        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Discogs API через Nuxt Nitro proxy (server/api/disco/**),
        # Nitro сам ходит в discogs FPM с DISCOGS_API_TOKEN. Префиксная
        # location с `^~` имеет приоритет над регуляркой ниже, поэтому
        # /api/disco/* НЕ уйдёт в main_web.
        location ^~ /api/disco/ {
            limit_req zone=bots burst=20 nodelay;
            limit_req zone=disco_all burst=50 nodelay;
            limit_req zone=perip burst=10 nodelay;
            limit_conn disco_conn 8;
            limit_conn nuxtconn 24;
            set $upstream_nuxt "nuxt:3000";
            proxy_pass http://$upstream_nuxt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Laravel API + Sanctum + public storage.
        # Внимание: /login и /admin — это страницы Nuxt SPA (pages/login.vue, pages/admin/*),
        # а не Laravel-Inertia. У Laravel есть только POST /api/auth/login через /api.
        location ~ ^/(api|sanctum|broadcasting|storage)(/|$) {
            limit_req zone=bots burst=20 nodelay;
            set $upstream_main "main-web:80";
            proxy_pass http://$upstream_main;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Reverb WebSocket
        location /app/ {
            # БЕЗ переменной: reverb — не контейнер этой машины, а запись в
            # /etc/hosts (extra_hosts → VM-2). Встроенный DNS Docker таких
            # записей не отдаёт, поэтому proxy_pass через resolver отвечает
            # 502. Статический резолв при старте читает /etc/hosts и работает.
            proxy_pass http://reverb:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Страницы дискографии — самая тяжёлая SSR-нагрузка и главная цель
        # выкачки. Держим их под общим потолком отдельно от остального сайта,
        # чтобы скрапер не утаскивал за собой главную и каталог.
        location ^~ /disco/ {
            limit_req zone=disco_all burst=50 nodelay;
            limit_req zone=perip burst=10 nodelay;
            limit_conn disco_conn 8;
            limit_conn nuxtconn 24;
            set $upstream_nuxt_disco "nuxt:3000";
            proxy_pass http://$upstream_nuxt_disco;
            proxy_read_timeout 25s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Всё остальное — Nuxt SSR
        location / {
            limit_req zone=bots burst=30 nodelay;
            limit_conn nuxtconn 24;
            # Метка «это живой браузер, а не одиночный запрос выкачки»:
            # см. map $cookie_mzs выше. Значения не несёт, персональных данных
            # в ней нет — только признак, что клиент уже открывал сайт.
            add_header Set-Cookie "mzs=1; Path=/; Max-Age=86400; SameSite=Lax" always;
            set $upstream_nuxt "nuxt:3000";
            proxy_pass http://$upstream_nuxt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
