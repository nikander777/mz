worker_processes auto;
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Ограничитель для ботов (работает по UA — см. map ниже)
    map $http_user_agent $is_bot {
        default 0;
        ~*(ClaudeBot|GPTBot|Claude-SearchBot|Applebot|YandexBot|Amazonbot|Bytespider|SemrushBot|DataForSeoBot|Googlebot) 1;
    }
    map $is_bot $bot_key {
        1 $binary_remote_addr;
        0 "";
    }
    limit_req_zone $bot_key zone=bots:10m rate=5r/s;

    upstream nuxt      { server nuxt:3000; keepalive 32; }
    upstream main_web  { server main-web:80; keepalive 32; }
    upstream discogs_web { server discogs-web:80; keepalive 32; }
    upstream reverb    { server reverb:8080; keepalive 32; }

    server {
        listen 80 default_server;
        server_name _;

        # Health check для мониторинга и Caddy
        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Laravel API + Sanctum + admin (Inertia)
        location ~ ^/(api|sanctum|broadcasting|login|admin|storage)(/|$) {
            limit_req zone=bots burst=20 nodelay;
            proxy_pass http://main_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Discogs service
        location /disco/ {
            limit_req zone=bots burst=20 nodelay;
            proxy_pass http://discogs_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Reverb WebSocket
        location /app/ {
            proxy_pass http://reverb;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Всё остальное — Nuxt SSR
        location / {
            limit_req zone=bots burst=30 nodelay;
            proxy_pass http://nuxt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
