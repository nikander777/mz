worker_processes auto;
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Ограничитель для ботов (работает по UA — см. map ниже)
    map $http_user_agent $is_bot {
        default 0;
        ~*(ClaudeBot|GPTBot|Claude-SearchBot|Applebot|YandexBot|Amazonbot|Bytespider|SemrushBot|DataForSeoBot|Googlebot) 1;
    }
    map $is_bot $bot_key {
        1 $binary_remote_addr;
        0 "";
    }
    limit_req_zone $bot_key zone=bots:10m rate=5r/s;

    # Встроенный DNS Docker. resolver + переменная в proxy_pass — заставляют
    # nginx ре-резолвить upstream (вместо одноразового резолва при старте);
    # без этого после recreate любого из контейнеров (nuxt/main-web/discogs-web/
    # reverb) edge продолжает ходить на старый IP, который мог достаться
    # другому контейнеру → Bad Gateway или ответы от чужого сервиса.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Connection для проксирования WebSocket: "upgrade" только когда клиент
    # действительно просит апгрейд. Жёстко зашитый "upgrade" на обычном GET
    # роняет соединение с апстримом и отдаёт 502.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Health check для мониторинга и Caddy
        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Discogs API через Nuxt Nitro proxy (server/api/disco/**),
        # Nitro сам ходит в discogs FPM с DISCOGS_API_TOKEN. Префиксная
        # location с `^~` имеет приоритет над регуляркой ниже, поэтому
        # /api/disco/* НЕ уйдёт в main_web.
        location ^~ /api/disco/ {
            limit_req zone=bots burst=20 nodelay;
            set $upstream_nuxt "nuxt:3000";
            proxy_pass http://$upstream_nuxt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Laravel API + Sanctum + public storage.
        # Внимание: /login и /admin — это страницы Nuxt SPA (pages/login.vue, pages/admin/*),
        # а не Laravel-Inertia. У Laravel есть только POST /api/auth/login через /api.
        location ~ ^/(api|sanctum|broadcasting|storage)(/|$) {
            limit_req zone=bots burst=20 nodelay;
            set $upstream_main "main-web:80";
            proxy_pass http://$upstream_main;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Reverb WebSocket
        location /app/ {
            # БЕЗ переменной: reverb — не контейнер этой машины, а запись в
            # /etc/hosts (extra_hosts → VM-2). Встроенный DNS Docker таких
            # записей не отдаёт, поэтому proxy_pass через resolver отвечает
            # 502. Статический резолв при старте читает /etc/hosts и работает.
            proxy_pass http://reverb:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Всё остальное — Nuxt SSR
        location / {
            limit_req zone=bots burst=30 nodelay;
            set $upstream_nuxt "nuxt:3000";
            proxy_pass http://$upstream_nuxt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
