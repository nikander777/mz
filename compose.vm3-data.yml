# VM-3 «data»: Postgres, Meilisearch, MinIO, бэкапы.
# Порты слушают на 0.0.0.0; внешка фильтруется UFW (whitelist VM1+VM2 IPs).
# При наличии VLAN можно поставить VM3_BIND=<private_ip> в .env.
name: muzilla-data

# Ротация логов Docker. Без неё json-лог растёт безгранично: 19.09.2026
# лог main-queue в петле MakeSearchable(artists) набрал 50 ГБ, диск VM-2
# ушёл в 100%, Redis не смог писать RDB и начал отдавать MISCONF —
# авторизация на сайте легла в 500.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  postgres:
    logging: *default-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${VM3_BIND:-0.0.0.0}:5432:5432"
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=32GB
      -c effective_cache_size=96GB
      -c max_connections=200
      -c work_mem=64MB
      -c maintenance_work_mem=2GB
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/data/server.crt
      -c ssl_key_file=/var/lib/postgresql/data/server.key

  # Отдельный кластер для muzilla_main (с 29.09.2026). В общем кластере любой
  # PANIC дискографии — а их было до 80 в сутки — перезапускал все процессы
  # Postgres и рвал соединения магазина: корзина, оплата, вход. Здесь только
  # main (~2 ГБ), поэтому памяти ему нужно на порядок меньше, а PITR (архив
  # WAL) не тащит за собой 100 ГБ дискографии. data_checksums включены при
  # initdb: тихая порча страниц видна при чтении, а не всплывает PANIC'ом.
  # Сертификат SSL — тот же, что у основного кластера, в docker/postgres-main-ssl
  # (вне git): клиенты ходят с sslmode=require.
  postgres-main:
    logging: *default-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MAIN_DB_DATABASE}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pg_main_data:/var/lib/postgresql/data
      - ./docker/postgres-main-ssl:/etc/postgresql/ssl:ro
    ports:
      - "${VM3_BIND:-0.0.0.0}:5433:5432"
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=4GB
      -c effective_cache_size=12GB
      -c max_connections=200
      -c work_mem=32MB
      -c maintenance_work_mem=1GB
      -c ssl=on
      -c ssl_cert_file=/etc/postgresql/ssl/server.crt
      -c ssl_key_file=/etc/postgresql/ssl/server.key

  meilisearch:
    logging: *default-logging
    image: getmeili/meilisearch:v1.53.1
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      # Суточный снапшот базы. 16.06.2026 LMDB индекса releases словила
      # повреждение на записи, восстанавливать было нечем — дампов не делали,
      # и раздел лежал два месяца. Снапшот перезаписывается на месте.
      MEILI_SCHEDULE_SNAPSHOT: "86400"
      MEILI_SNAPSHOT_DIR: /meili_data/snapshots
    # Дефолтный soft-лимит docker = 1024 fd: settingsUpdate на индексе releases
    # (19M документов) падает с too_many_open_files (os error 24).
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    volumes:
      # v2 — том, пересозданный 24.08.2026 при переезде 1.6.2 → 1.53.1.
      # Старый meili_data остался с битым индексом releases.
      - meili_data_v2:/meili_data
    ports:
      - "${VM3_BIND:-0.0.0.0}:7700:7700"
    # Без healthcheck крэш-петля (restart: unless-stopped + SIGABRT раз в минуту)
    # никак не проявляется снаружи: контейнер вечно «Restarting», алертов нет.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  # Отдельный экземпляр Meili для main: products и sellers (с 01.10.2026).
  # Индексы дискографии повреждены и не раз роняли весь процесс (SIGSEGV,
  # вечные циклы в фасетах) — вместе с ними лежал поиск и каталог товаров.
  # Объём main — полмиллиона документов, собирается за минуты; при порче
  # пересобирается из Postgres (products:meili-index, scout:import).
  meilisearch-main:
    logging: *default-logging
    image: getmeili/meilisearch:v1.53.1
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_SCHEDULE_SNAPSHOT: "86400"
      MEILI_SNAPSHOT_DIR: /meili_data/snapshots
      # По умолчанию Meili склеивает накопившиеся задачи в батч до 10 ГиБ и
      # падает на нём с «size is greater than supported» (01.10.2026: 199 из
      # 266 задач первичной заливки), а индексации отдаёт до 2/3 памяти
      # машины — на VM-3, где у Postgres 32 ГБ shared_buffers.
      MEILI_EXPERIMENTAL_MAX_NUMBER_OF_BATCHED_TASKS: "10"
      MEILI_EXPERIMENTAL_LIMIT_BATCHED_TASKS_TOTAL_SIZE: "1073741824"
      MEILI_MAX_INDEXING_MEMORY: "8GiB"
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    volumes:
      - meili_main_data:/meili_data
    ports:
      - "${VM3_BIND:-0.0.0.0}:7701:7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  minio:
    logging: *default-logging
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${VM3_BIND:-0.0.0.0}:9000:9000"
      - "${VM3_BIND:-0.0.0.0}:9001:9001"
    restart: unless-stopped

  pgbackups:
    logging: *default-logging
    image: prodrigestivill/postgres-backup-local:17
    environment:
      POSTGRES_HOST: postgres
      # muzilla_main с 29.09.2026 живёт в postgres-main — его дампит pgbackups-main
      POSTGRES_DB: ${DISCOGS_DB_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # данные failed_jobs не нужны для восстановления, а битый TOAST в них дважды
      # обрывал дамп целиком (22.09 main, 29.09 discogs); схема таблицы остаётся
      POSTGRES_EXTRA_OPTS: "-Z1 --exclude-table-data=failed_jobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    depends_on: [postgres]
    restart: unless-stopped

  # Локальный ночной дамп muzilla_main из отдельного кластера. Внешние копии —
  # scripts/backup (pg-offsite.sh main).
  pgbackups-main:
    logging: *default-logging
    image: prodrigestivill/postgres-backup-local:17
    environment:
      POSTGRES_HOST: postgres-main
      POSTGRES_DB: ${MAIN_DB_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z1 --exclude-table-data=failed_jobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    depends_on: [postgres-main]
    restart: unless-stopped

volumes:
  pg_data:
  pg_main_data:
  # meili_data — том Meilisearch 1.6.2, выведен из эксплуатации 24.08.2026
  # (повреждённая LMDB индекса releases). Объявлен, чтобы compose не терял
  # его из виду до удаления вручную.
  meili_data:
  meili_data_v2:
  meili_main_data:
  minio_data:
