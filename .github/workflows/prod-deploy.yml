name: Deploy 3-VM prod

# Только ручной запуск через UI (Actions → Run workflow). Никакого
# auto-deploy на prod от push'а в сервисный репо. Сначала проверяем на
# stage (https://mzt.nadev.ru), потом руками катим на prod.
#
# Использует отдельные secrets PROD_VM*_HOST + PROD_SSH_PRIVATE_KEY,
# чтобы случайно не задеть stage-VPS.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Куда деплоим'
        required: true
        default: 'vm1'
        type: choice
        options:
          - all
          - vm1
          - vm2
          - vm3
      run_migrations:
        description: 'Запустить migrate на VM-1 после деплоя'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_KEY_PATH: ~/.ssh/prod_deploy_key

jobs:
  # ===== VM-3 (Data) — первой =====
  deploy-vm3:
    if: ${{ inputs.target == 'all' || inputs.target == 'vm3' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ${{ env.SSH_KEY_PATH }}
          chmod 600 ${{ env.SSH_KEY_PATH }}
          ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.VM3_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy VM-3
        run: |
          ssh -i ${{ env.SSH_KEY_PATH }} -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.VM3_HOST }} bash -s <<'REMOTE'
          set -e
          cd /opt/muzilla
          git pull origin main
          docker compose -f compose.vm3-data.yml pull --ignore-pull-failures || true
          docker compose -f compose.vm3-data.yml up -d
          sleep 10
          docker compose -f compose.vm3-data.yml exec -T postgres pg_isready -U muzilla
          echo "VM-3 OK"
          REMOTE

  # ===== VM-2 (App) — после VM-3 =====
  deploy-vm2:
    needs: [deploy-vm3]
    if: ${{ always() && !failure() && (inputs.target == 'all' || inputs.target == 'vm2') }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ${{ env.SSH_KEY_PATH }}
          chmod 600 ${{ env.SSH_KEY_PATH }}
          ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.VM2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy VM-2
        run: |
          ssh -i ${{ env.SSH_KEY_PATH }} -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.VM2_HOST }} bash -s <<'REMOTE'
          set -e
          cd /opt/muzilla
          git pull origin main
          docker compose -f compose.vm2-app.yml pull --ignore-pull-failures || true
          docker compose -f compose.vm2-app.yml up -d
          sleep 5
          docker compose -f compose.vm2-app.yml exec -T redis redis-cli -a "$(grep ^REDIS_PASSWORD .env | cut -d= -f2)" ping
          echo "VM-2 OK"
          REMOTE

  # ===== VM-1 (Edge) — последней =====
  deploy-vm1:
    needs: [deploy-vm2]
    if: ${{ always() && !failure() && (inputs.target == 'all' || inputs.target == 'vm1') }}
    runs-on: ubuntu-latest
    env:
      RUN_MIGRATIONS: ${{ inputs.run_migrations }}
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ${{ env.SSH_KEY_PATH }}
          chmod 600 ${{ env.SSH_KEY_PATH }}
          ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.VM1_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy VM-1
        run: |
          ssh -i ${{ env.SSH_KEY_PATH }} -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.VM1_HOST }} \
            RUN_MIGRATIONS="$RUN_MIGRATIONS" bash -s <<'REMOTE'
          set -e
          cd /opt/muzilla
          git pull origin main
          docker compose -f compose.vm1-edge.yml pull --ignore-pull-failures || true
          docker compose -f compose.vm1-edge.yml up -d --remove-orphans
          sleep 10
          if [ "$RUN_MIGRATIONS" = "true" ]; then
            echo "Running migrations..."
            docker compose -f compose.vm1-edge.yml exec -T main php artisan migrate --force || true
            docker compose -f compose.vm1-edge.yml exec -T discogs php artisan migrate --force || true
          fi
          docker compose -f compose.vm1-edge.yml restart edge
          sleep 5
          for i in 1 2 3 4 5; do
            curl -sf http://localhost:8080/health > /dev/null && echo "Health OK ($i)" && break
            echo "Attempt $i: waiting..."; sleep 5
            [ $i -eq 5 ] && (echo "Health check failed!" && exit 1)
          done
          echo "VM-1 OK"
          REMOTE
