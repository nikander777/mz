name: Deploy stage (single VPS)

# Триггеры:
#   - repository_dispatch с event-type "deploy-vm1" — приходит от build.yml
#     каждого из 3 сервисных репо после успешной сборки.
#   - workflow_dispatch — ручной запуск.
on:
  repository_dispatch:
    types: [deploy-vm1, deploy-stage]

  workflow_dispatch:

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.VM1_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy script on VPS
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.VM1_HOST }} \
            SERVICE="$SERVICE" IS_MANUAL="$IS_MANUAL" bash -s <<'REMOTE'
          set -e
          cd /opt/muzilla
          echo "=== Pulling ops repo ==="
          git pull origin main
          echo "=== Pulling images from GHCR (best-effort) ==="
          docker compose -f compose.stage.yml pull --ignore-pull-failures || true
          echo "=== Recreating containers ==="
          docker compose -f compose.stage.yml up -d --remove-orphans
          sleep 10
          echo "=== Migrations (per-service) ==="
          if [ "$SERVICE" = "main" ] || [ "$IS_MANUAL" = "true" ]; then
            docker compose -f compose.stage.yml exec -T main php artisan migrate --force || true
          fi
          if [ "$SERVICE" = "discogs" ] || [ "$IS_MANUAL" = "true" ]; then
            docker compose -f compose.stage.yml exec -T discogs php artisan migrate --force || true
          fi
          echo "=== Restart edge (sbros DNS upstream cache) ==="
          docker compose -f compose.stage.yml restart edge
          echo "=== Smoke ==="
          curl -sf http://localhost:8080/health || (echo "Health check failed!" && exit 1)
          echo "=== Deploy OK ==="
          REMOTE
