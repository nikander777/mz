# VM-2 «app»: Redis, Reverb (WSS), очереди, scheduler.
# Ходит в VM-3 за БД и Meili.
name: muzilla-app

x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: ${VM3_HOST}
  DB_PORT: 5432
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  SCOUT_DRIVER: meilisearch
  MEILISEARCH_HOST: http://${VM3_HOST}:7700
  MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
  # Драйвер каталога discogs: database (Postgres) | meili. Флипается через .env.
  DISCO_CATALOG_DRIVER: ${DISCO_CATALOG_DRIVER:-database}
  # Раздел Hi-Fi (config/features.php). Выключен на старте. Парный флаг
  # фронта — NUXT_PUBLIC_FEATURE_HIFI в compose.vm1-edge.yml.
  MZ_FEATURE_HIFI: ${MZ_FEATURE_HIFI:-false}
  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  DISCOGS_API_TOKEN: ${DISCOGS_API_TOKEN}
  # Personal access token discogs.com — DiscogsApiService использует его
  # для запросов в api.discogs.com (без него 429/401).
  DISCOGS_USER_TOKEN: ${DISCOGS_USER_TOKEN}
  # См. compose.vm1-edge.yml — middleware api.token в discogs сравнивает
  # Bearer-token c INTERNAL_API_TOKEN. Совмещаем с DISCOGS_API_TOKEN.
  INTERNAL_API_TOKEN: ${DISCOGS_API_TOKEN}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}
  SESSION_DOMAIN: ${SESSION_DOMAIN}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  # S3 Media Storage (Timeweb Cloud) — критично для discogs-queue:
  # очереди image-loading-high и image-processing пишут изображения именно отсюда.
  S3_MEDIA_KEY: ${S3_MEDIA_KEY}
  S3_MEDIA_SECRET: ${S3_MEDIA_SECRET}
  S3_MEDIA_REGION: ${S3_MEDIA_REGION:-ru-1}
  S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
  S3_MEDIA_ENDPOINT: ${S3_MEDIA_ENDPOINT}
  S3_MEDIA_URL: ${S3_MEDIA_URL}
  S3_MEDIA_PATH_STYLE: ${S3_MEDIA_PATH_STYLE:-true}
  # Image Processing
  IMAGE_DISK: ${IMAGE_DISK:-s3-media}
  IMAGE_DRIVER: ${IMAGE_DRIVER:-gd}
  IMAGE_WEBP_QUALITY: ${IMAGE_WEBP_QUALITY:-85}
  # Super Admin для сидера (на VM-2 нужен в main-queue/scheduler если они
  # вызывают ProductionSeeder). Значения в /opt/muzilla/.env, gitignored.
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PHONE: ${ADMIN_PHONE}
  ADMIN_USERNAME: ${ADMIN_USERNAME}
  ADMIN_NAME: ${ADMIN_NAME}
  ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
  ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  # SMS-провайдер (sms4b.ru) — main-queue отправляет коды регистрации
  # асинхронно через Job. main-scheduler триггерит retry для зависших.
  SMS_PROVIDER: ${SMS_PROVIDER}
  SMS4B_TOKEN: ${SMS4B_TOKEN}
  SMS4B_SENDER: ${SMS4B_SENDER}
  # SMTP (mail.netangels.ru) — main-queue асинхронно отправляет email-уведомления
  # о статусах заказа, выплатах и непрочитанных сообщениях.
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-mail.netangels.ru}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@muzilla.ru}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Muzilla}
  # Базовый URL фронтенда — используется в ссылках внутри email-шаблонов.
  APP_FRONTEND_URL: ${APP_FRONTEND_URL}



  # === Платежи: касса ПА ООО «ПЭЙ ЭНИ ВЭЙ» (54-ФЗ) ===
  # На VM-2 эти переменные нужны не меньше, чем на edge: подтверждение холдов
  # (SettleAuthorizedHolds), сверка операций (ReconcileBpaPayments), возвраты
  # и разблокировка расчётов с продавцом живут в queue и scheduler. Без ключей
  # фоновые джобы падают, а деньги зависают в промежуточном состоянии.
  PAYMENTS_DRIVER: ${PAYMENTS_DRIVER:-moneta}
  BPA_KEY: ${BPA_KEY}
  BPA_SECRET: ${BPA_SECRET}
  BPA_CREDIT_ACCOUNT: ${BPA_CREDIT_ACCOUNT}
  BPA_DEBIT_ACCOUNT: ${BPA_DEBIT_ACCOUNT}
  BPA_API_URL: ${BPA_API_URL:-https://bpa.payanyway.ru/api}
  BPA_ASSISTANT_URL: ${BPA_ASSISTANT_URL:-https://www.payanyway.ru/assistant.htm}
  BPA_USE_STUB: ${BPA_USE_STUB:-false}
  BPA_QR_TTL: ${BPA_QR_TTL:-30}
  BPA_WEBHOOK_SECRET: ${BPA_WEBHOOK_SECRET}
  BPA_WEBHOOK_ALLOWED_IPS: ${BPA_WEBHOOK_ALLOWED_IPS}
  BPA_WEBHOOK_VERIFY_VIA_API: ${BPA_WEBHOOK_VERIFY_VIA_API:-true}
  BPA_ALLOWLIST_BUYER_IDS: ${BPA_ALLOWLIST_BUYER_IDS}
  BPA_ALLOWLIST_SELLER_IDS: ${BPA_ALLOWLIST_SELLER_IDS}
  PAYMENTS_PLATFORM_ACCOUNT: ${PAYMENTS_PLATFORM_ACCOUNT}
  PAYMENTS_PLATFORM_INN: ${PAYMENTS_PLATFORM_INN}
  PAYMENTS_PLATFORM_NAME: ${PAYMENTS_PLATFORM_NAME:-OOO M9}
  PAYMENTS_PLATFORM_PHONE: ${PAYMENTS_PLATFORM_PHONE}

  # === Каталог товаров: meili|database (откат — database) ===
  MZ_CATALOG_DRIVER_PRODUCTS: ${MZ_CATALOG_DRIVER_PRODUCTS:-database}

  # === Доставка ===
  # Перевозчик по умолчанию (config/delivery.php) — подстановка ПВЗ в новый
  # лот, дефолт карты на чекауте. Смена значения не отключает Почту России.
  DELIVERY_DEFAULT_CARRIER: ${DELIVERY_DEFAULT_CARRIER:-cdek}
  # СДЭК API v2 — ПВЗ на карте, тарифы, заявки, трекинг. Каталог ПВЗ
  # синхронизируется командой cdek:sync-pickup-points (крон 04:00), карта
  # читает точки bbox-запросом. Боевые креды и CDEK_SANDBOX=false — в .env
  # на сервере (в git не коммитятся).
  CDEK_ACCOUNT: ${CDEK_ACCOUNT}
  CDEK_SECURE: ${CDEK_SECURE}
  CDEK_SANDBOX: ${CDEK_SANDBOX:-true}
  CDEK_BASE_URL: ${CDEK_BASE_URL:-}
  CDEK_TIMEOUT: ${CDEK_TIMEOUT:-30}
  CDEK_FORCE_SHIPMENT_POINT: ${CDEK_FORCE_SHIPMENT_POINT:-}
  # Почта России — расчёт доставки, треки, QR-стикеры.
  RUSSIAN_POST_TOKEN: ${RUSSIAN_POST_TOKEN}
  RUSSIAN_POST_KEY: ${RUSSIAN_POST_KEY}
  RUSSIAN_POST_LOGIN: ${RUSSIAN_POST_LOGIN}
  RUSSIAN_POST_PASSWORD: ${RUSSIAN_POST_PASSWORD}
  RUSSIAN_POST_FORCE_OPS_CODE: ${RUSSIAN_POST_FORCE_OPS_CODE}

  # === DaData — подсказки адресов, городов, почтовых отделений ===
  DADATA_API_KEY: ${DADATA_API_KEY}
  DADATA_SECRET_KEY: ${DADATA_SECRET_KEY}

  # === VK ID OAuth (id.vk.ru) — server-side OAuth flow ===
  # Redirect URI должен быть прописан 1-в-1 в кабинете VK ID.
  VKID_CLIENT_ID: ${VKID_CLIENT_ID}
  VKID_CLIENT_SECRET: ${VKID_CLIENT_SECRET}
  VKID_REDIRECT_URI: ${VKID_REDIRECT_URI:-https://new.muzilla.ru/api/auth/vk/callback}

  # === Legacy MySQL — только на время миграции со старого портала ===
  # Задействован, когда на VM-3 поднят compose.legacy-mysql.yml. Вне миграции
  # переменные игнорируются (migrate-old:* не вызывается).
  LEGACY_DB_HOST: ${LEGACY_DB_HOST:-}
  LEGACY_DB_PORT: ${LEGACY_DB_PORT:-3306}
  LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-mz}
  LEGACY_DB_USERNAME: ${LEGACY_DB_USERNAME:-root}
  LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-}

services:
  redis:
    image: redis:7-alpine
    # На публичной сети без VLAN — обязательно с паролем.
    # maxmemory + noeviction: страховка от OOM-killer'а на VM-2 (8GB RAM).
    # Когда лимит достигнут, новые INSERT/RPUSH будут падать (а не выгружать
    # критичные сессии/кеш по LRU). Прецедент: image-loading queue распухал
    # до 10M jobs (~7GB), redis съедал всю память → OOM убивал redis →
    # workers падали → импорт стопался.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "4gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      # Слушает все интерфейсы; внешка фильтруется UFW (whitelist VM1).
      - "${VM2_BIND:-0.0.0.0}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  reverb:
    image: ghcr.io/nikander777/mz-main:${MAIN_TAG:-latest}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      <<: *laravel-env
      APP_KEY: ${MAIN_APP_KEY}
      APP_URL: ${MAIN_APP_URL}
      DB_DATABASE: ${MAIN_DB_DATABASE}
    ports:
      - "${VM2_BIND:-0.0.0.0}:8080:8080"
    depends_on: [redis]
    restart: unless-stopped

  main-queue:
    image: ghcr.io/nikander777/mz-main:${MAIN_TAG:-latest}
    # Очереди перечислены в порядке приоритета. Тяжёлые медиа-задачи вынесены
    # в main-queue-media, иначе перенос фото блокирует письма и платежи.
    command: php artisan queue:work --queue=default,cache-warm --tries=3 --timeout=120
    environment:
      <<: *laravel-env
      APP_KEY: ${MAIN_APP_KEY}
      APP_URL: ${MAIN_APP_URL}
      DB_DATABASE: ${MAIN_DB_DATABASE}
    depends_on: [redis]
    restart: unless-stopped

  # Медиа-воркер main: перенос фото со старого портала (legacy-photos) и
  # генерация размерных вариантов (image-processing). Таймаут 900 с — батч
  # MigrateProductPhotosBatchJob объявляет timeout=600 и качает пачку файлов
  # с images.muzilla.ru. Две реплики: миграция каталога упирается в сеть.
  main-queue-media:
    image: ghcr.io/nikander777/mz-main:${MAIN_TAG:-latest}
    command: php artisan queue:work --queue=legacy-photos,image-processing --tries=3 --timeout=900
    environment:
      <<: *laravel-env
      APP_KEY: ${MAIN_APP_KEY}
      APP_URL: ${MAIN_APP_URL}
      DB_DATABASE: ${MAIN_DB_DATABASE}
    depends_on: [redis]
    deploy:
      replicas: ${MAIN_MEDIA_WORKERS:-2}
    restart: unless-stopped

  main-scheduler:
    image: ghcr.io/nikander777/mz-main:${MAIN_TAG:-latest}
    command: php artisan schedule:work
    environment:
      <<: *laravel-env
      APP_KEY: ${MAIN_APP_KEY}
      APP_URL: ${MAIN_APP_URL}
      DB_DATABASE: ${MAIN_DB_DATABASE}
    depends_on: [redis]
    restart: unless-stopped

  discogs-queue:
    image: ghcr.io/nikander777/mz-discogs:${DISCOGS_TAG:-latest}
    command: php artisan queue:work --queue=image-loading-high,image-processing,image-loading,default --tries=3 --timeout=300
    environment:
      <<: *laravel-env
      APP_KEY: ${DISCOGS_APP_KEY}
      APP_URL: ${DISCOGS_APP_URL}
      DB_DATABASE: ${DISCOGS_DB_DATABASE}
    volumes:
      # Дополнительный диск VM-2 (примонтирован руками в /mnt/disk2),
      # под XML-дампы Discogs + part-файлы от discogs:split-xml.
      # Корневой раздел /opt забит другими импортами. RW нужен для
      # split-xml который пишет partitions рядом с дампом.
      - /mnt/disk2:/discogs-dump
    depends_on: [redis]
    restart: unless-stopped

  discogs-scheduler:
    image: ghcr.io/nikander777/mz-discogs:${DISCOGS_TAG:-latest}
    command: php artisan schedule:work
    environment:
      <<: *laravel-env
      APP_KEY: ${DISCOGS_APP_KEY}
      APP_URL: ${DISCOGS_APP_URL}
      DB_DATABASE: ${DISCOGS_DB_DATABASE}
    depends_on: [redis]
    restart: unless-stopped

volumes:
  redis_data:
