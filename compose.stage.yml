# MUZILLA — stage/single-host deploy.
# Все сервисы на одной машине. Образы берутся из GHCR.
# Для локального билда есть build: секции — `docker compose -f compose.stage.yml build`.
#
# Запуск (pull готовых образов):
#   cp .env.prod.example .env
#   docker login ghcr.io
#   docker compose -f compose.stage.yml pull
#   docker compose -f compose.stage.yml up -d
#
# Или локальная сборка:
#   docker compose -f compose.stage.yml build
#   docker compose -f compose.stage.yml up -d

name: muzilla-stage

x-laravel-env: &laravel-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  # Время жизни сессии, минуты. Дефолт Laravel — 120 (2 часа): для маркетплейса
  # это значит разлогин между заходами. Сессии лежат в Redis с TTL по этому
  # значению, поэтому его рост увеличивает и объём ключей сессий.
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_EXPIRE_ON_CLOSE: ${SESSION_EXPIRE_ON_CLOSE:-false}
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  SCOUT_DRIVER: meilisearch
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
  # Драйвер каталога: meili|database (откат — database). Управляется из .env.
  MZ_CATALOG_DRIVER_PRODUCTS: ${MZ_CATALOG_DRIVER_PRODUCTS:-database}
  DISCO_CATALOG_DRIVER: ${DISCO_CATALOG_DRIVER:-database}
  # Раздел Hi-Fi (config/features.php). Выключен на старте: логистика под
  # крупногабаритные товары не готова. Парный флаг фронта — ниже, у nuxt.
  MZ_FEATURE_HIFI: ${MZ_FEATURE_HIFI:-false}
  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  DISCOGS_API_TOKEN: ${DISCOGS_API_TOKEN}
  # main ходит во внутренний discogs API (например, migrate-old:products --remap-releases).
  # DISCOGS_API_TOKEN отправляется Bearer'ом, на стороне discogs ApiTokenMiddleware
  # сравнивает с INTERNAL_API_TOKEN — поэтому оба значения равны.
  DISCOGS_API_URL: http://discogs-web
  INTERNAL_API_TOKEN: ${DISCOGS_API_TOKEN}
  # === Moneta (demo среда — предпрод-тесты) ===
  MONETA_MERCHANT_ID: ${MONETA_MERCHANT_ID}
  MONETA_API_LOGIN: ${MONETA_API_LOGIN}
  MONETA_API_KEY: ${MONETA_API_KEY}
  MONETA_SECRET_KEY: ${MONETA_SECRET_KEY}
  MONETA_ACCOUNT_ID: ${MONETA_ACCOUNT_ID}
  MONETA_TRANSIT_ACCOUNT: ${MONETA_TRANSIT_ACCOUNT}
  MONETA_COMMISSION_ACCOUNT: ${MONETA_COMMISSION_ACCOUNT}
  MONETA_SECURITY_ACCOUNT: ${MONETA_SECURITY_ACCOUNT}
  MONETA_PAYMENT_PASSWORD: ${MONETA_PAYMENT_PASSWORD}
  MONETA_MERCHANT_PAYMENT_PASSWORD: ${MONETA_MERCHANT_PAYMENT_PASSWORD}
  MONETA_API_URL: ${MONETA_API_URL}
  MONETA_TEST_MODE: ${MONETA_TEST_MODE}
  MONETA_USE_STUB: ${MONETA_USE_STUB}
  MONETA_WEBHOOK_URL: ${MONETA_WEBHOOK_URL}
  MONETA_MERCHANT_WEBHOOK_URL: ${MONETA_MERCHANT_WEBHOOK_URL}
  # «Код проверки целостности данных» ЛК2 — им НКО подписывает коллбеки
  # MerchantAPI. Пусто вне local = /api/webhook/moneta/merchant закрыт 503-м,
  # и договор продавца никогда не станет ACTIVE автоматически.
  MONETA_MERCHANT_WEBHOOK_SECRET: ${MONETA_MERCHANT_WEBHOOK_SECRET}
  # Перепроверка коллбека в НКО вместо подписи: «код проверки целостности
  # данных» в интерфейсе ЛК2 не находится, и без этого флага онбординг
  # продавцов был бы закрыт наглухо (эндпоинт отвечает 503).
  MONETA_MERCHANT_WEBHOOK_VERIFY_VIA_API: ${MONETA_MERCHANT_WEBHOOK_VERIFY_VIA_API:-true}
  MONETA_WEBHOOK_ALLOWED_IPS: ${MONETA_WEBHOOK_ALLOWED_IPS}
  MONETA_SUCCESS_URL: ${MONETA_SUCCESS_URL}
  MONETA_FAIL_URL: ${MONETA_FAIL_URL}
  MONETA_USERNAME: ${MONETA_USERNAME}
  MONETA_PASSWORD: ${MONETA_PASSWORD}
  MONETA_UNIT_ROOT: ${MONETA_UNIT_ROOT}
  MONETA_UNIT_REGISTERED: ${MONETA_UNIT_REGISTERED}
  MONETA_UNIT_ACTIVE: ${MONETA_UNIT_ACTIVE}
  MONETA_UNIT_WITHOUT_AGREEMENT: ${MONETA_UNIT_WITHOUT_AGREEMENT}
  MONETA_ACCOUNT_PROTOTYPE: ${MONETA_ACCOUNT_PROTOTYPE}
  MONETA_TEST_SBP_PHONE: ${MONETA_TEST_SBP_PHONE}
  MONETA_TEST_SBP_BANK_ID: ${MONETA_TEST_SBP_BANK_ID}
  # Имена атрибутов профиля НКО для налогового режима и ставки НДС.
  # Пусто = не отправлять (нераспознанный ключ отбивает весь EditProfile).
  MONETA_ATTR_TAX_REGIME: ${MONETA_ATTR_TAX_REGIME}
  MONETA_ATTR_VAT_CODE: ${MONETA_ATTR_VAT_CODE}
  # Гейт каталога: товары видны только после одобрения анкеты НКО.
  MZ_REQUIRE_MONETA_APPROVAL: ${MZ_REQUIRE_MONETA_APPROVAL:-true}
  # === Платежи: касса ПА ООО «ПЭЙ ЭНИ ВЭЙ» (54-ФЗ) ===
  # Драйвер НОВЫХ заказов: moneta (историческая схема, чеков нет) | bpa
  # (JSON API с номенклатурой, чек 54-ФЗ пробивает ККТ агрегатора).
  # Уже созданные заказы не затрагиваются: провайдер каждого записан в
  # order_payments.provider и оттуда резолвится до конца жизни заказа.
  PAYMENTS_DRIVER: ${PAYMENTS_DRIVER:-moneta}
  BPA_KEY: ${BPA_KEY}
  BPA_SECRET: ${BPA_SECRET}
  BPA_CREDIT_ACCOUNT: ${BPA_CREDIT_ACCOUNT}
  BPA_DEBIT_ACCOUNT: ${BPA_DEBIT_ACCOUNT}
  BPA_API_URL: ${BPA_API_URL:-https://bpa.payanyway.ru/api}
  BPA_ASSISTANT_URL: ${BPA_ASSISTANT_URL:-https://www.payanyway.ru/assistant.htm}
  BPA_USE_STUB: ${BPA_USE_STUB:-false}
  BPA_QR_TTL: ${BPA_QR_TTL:-30}
  # Уведомления агрегатора подписи НЕ имеют. Секрет в пути роута
  # /api/webhook/bpa/{secret}; пусто = эндпоинт отвечает 503.
  BPA_WEBHOOK_SECRET: ${BPA_WEBHOOK_SECRET}
  BPA_WEBHOOK_ALLOWED_IPS: ${BPA_WEBHOOK_ALLOWED_IPS}
  # Главный эшелон защиты: состояние денег берём из /api/getoperation, а не из
  # тела уведомления. Выключается только на время работы с эмулятором.
  BPA_WEBHOOK_VERIFY_VIA_API: ${BPA_WEBHOOK_VERIFY_VIA_API:-true}
  BPA_ALLOWLIST_BUYER_IDS: ${BPA_ALLOWLIST_BUYER_IDS}
  BPA_ALLOWLIST_SELLER_IDS: ${BPA_ALLOWLIST_SELLER_IDS}
  # Реквизиты площадки для строки доставки в чеке: у доставки нет продавца,
  # договор с перевозчиком заключён площадкой.
  PAYMENTS_PLATFORM_ACCOUNT: ${PAYMENTS_PLATFORM_ACCOUNT}
  PAYMENTS_PLATFORM_INN: ${PAYMENTS_PLATFORM_INN}
  PAYMENTS_PLATFORM_NAME: ${PAYMENTS_PLATFORM_NAME:-OOO M9}
  PAYMENTS_PLATFORM_PHONE: ${PAYMENTS_PLATFORM_PHONE}
  # S3 Media Storage (Timeweb Cloud) — общий бакет для main и discogs
  S3_MEDIA_KEY: ${S3_MEDIA_KEY}
  S3_MEDIA_SECRET: ${S3_MEDIA_SECRET}
  S3_MEDIA_REGION: ${S3_MEDIA_REGION:-ru-1}
  S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
  S3_MEDIA_ENDPOINT: ${S3_MEDIA_ENDPOINT}
  S3_MEDIA_URL: ${S3_MEDIA_URL}
  S3_MEDIA_PATH_STYLE: ${S3_MEDIA_PATH_STYLE:-true}
  # Image Processing
  IMAGE_DISK: ${IMAGE_DISK:-public}
  IMAGE_DRIVER: ${IMAGE_DRIVER:-gd}
  IMAGE_WEBP_QUALITY: ${IMAGE_WEBP_QUALITY:-85}
  # Russian Post (Pochta Russia) API — расчёт доставки, треки, QR-стикеры.
  RUSSIAN_POST_TOKEN: ${RUSSIAN_POST_TOKEN}
  RUSSIAN_POST_KEY: ${RUSSIAN_POST_KEY}
  RUSSIAN_POST_LOGIN: ${RUSSIAN_POST_LOGIN}
  RUSSIAN_POST_PASSWORD: ${RUSSIAN_POST_PASSWORD}
  # Временный override ОПС отправителя — все заказы шлются из этого индекса
  # вместо адреса/ПВЗ продавца. Нужен пока кабинет Otpravka (ООО М9, ЕКБ)
  # обслуживает не все регионы РФ. Убрать из .env когда подключат всё —
  # postoffice-code будет браться из orderData['sender']['postal_code'].
  RUSSIAN_POST_FORCE_OPS_CODE: ${RUSSIAN_POST_FORCE_OPS_CODE}
  # СДЭК (CDEK) API v2 — ПВЗ на карте + создание заказов/тарифы. Каталог ПВЗ
  # синхронизируется в БД командой cdek:sync-pickup-points (крон 04:00), карта
  # читает точки bbox-запросом. Боевые креды и CDEK_SANDBOX=false — в .env на
  # сервере (в git не коммитятся).
  CDEK_ACCOUNT: ${CDEK_ACCOUNT}
  CDEK_SECURE: ${CDEK_SECURE}
  CDEK_SANDBOX: ${CDEK_SANDBOX:-true}
  CDEK_BASE_URL: ${CDEK_BASE_URL:-}
  CDEK_TIMEOUT: ${CDEK_TIMEOUT:-30}
  CDEK_FORCE_SHIPMENT_POINT: ${CDEK_FORCE_SHIPMENT_POINT:-}
  # SMS-провайдер (sms4b.ru) — main отправляет коды регистрации.
  SMS_PROVIDER: ${SMS_PROVIDER}
  SMS4B_TOKEN: ${SMS4B_TOKEN}
  SMS4B_SENDER: ${SMS4B_SENDER}
  # DaData — подсказки адресов, городов, почтовых отделений.
  DADATA_API_KEY: ${DADATA_API_KEY}
  DADATA_SECRET_KEY: ${DADATA_SECRET_KEY}
  # SMTP (mail.netangels.ru) — main асинхронно отправляет email-уведомления
  # о статусах заказа, выплатах и непрочитанных сообщениях.
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-mail.netangels.ru}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@muzilla.ru}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Muzilla}
  # Базовый URL фронтенда — используется в ссылках внутри email-шаблонов.
  APP_FRONTEND_URL: ${APP_FRONTEND_URL}
  # VK ID OAuth (id.vk.ru) — server-side OAuth flow для входа через VK.
  # Redirect URI должен быть прописан 1-в-1 в кабинете VK ID.
  VKID_CLIENT_ID: ${VKID_CLIENT_ID}
  VKID_CLIENT_SECRET: ${VKID_CLIENT_SECRET}
  VKID_REDIRECT_URI: ${VKID_REDIRECT_URI:-https://dev.muzilla.ru/api/auth/vk/callback}
  # Session/Sanctum cookie config — Laravel за edge nginx (HTTPS) на dev/prod.
  # Без них session cookie ставится для пустого домена и без Secure-attr,
  # OAuth-сессия теряется между redirect и callback (PKCE-verifier).
  SESSION_DOMAIN: ${SESSION_DOMAIN}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
  # Legacy MySQL — задействован только если поднят сервис legacy-mysql (профиль `legacy`).
  # На обычном stage эти переменные игнорируются (migrate-old:* не вызывается).
  LEGACY_DB_HOST: ${LEGACY_DB_HOST:-legacy-mysql}
  LEGACY_DB_PORT: ${LEGACY_DB_PORT:-3306}
  LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-mz}
  LEGACY_DB_USERNAME: ${LEGACY_DB_USERNAME:-root}
  LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  main:
    image: ghcr.io/nikander777/mz-main:${MAIN_TAG:-latest}
    build:
      context: ./main
      dockerfile: Dockerfile
    environment:
      <<: *laravel-env
      APP_KEY: ${MAIN_APP_KEY}
      APP_URL: ${MAIN_APP_URL}
      DB_DATABASE: ${MAIN_DB_DATABASE}
      DISCOGS_DB_CONNECTION: pgsql
      DISCOGS_DB_HOST: postgres
      DISCOGS_DB_PORT: 5432
      DISCOGS_DB_DATABASE: ${MAIN_DISCOGS_DB_DATABASE}
      DISCOGS_DB_USERNAME: ${POSTGRES_USER}
      DISCOGS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      RUN_MIGRATIONS: "true"
    volumes:
      - main_storage:/var/www/html/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  main-web:
    image: ghcr.io/nikander777/mz-main-web:${MAIN_TAG:-latest}
    build:
      context: ./main
      dockerfile: Dockerfile.web
    environment:
      FPM_HOST: main
    depends_on:
      - main
    restart: unless-stopped

  discogs:
    image: ghcr.io/nikander777/mz-discogs:${DISCOGS_TAG:-latest}
    build:
      context: ./discogs
      dockerfile: Dockerfile
    environment:
      <<: *laravel-env
      APP_KEY: ${DISCOGS_APP_KEY}
      APP_URL: ${DISCOGS_APP_URL}
      DB_DATABASE: ${DISCOGS_DB_DATABASE}
      RUN_MIGRATIONS: "true"
    volumes:
      - discogs_storage:/var/www/html/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  discogs-web:
    image: ghcr.io/nikander777/mz-discogs-web:${DISCOGS_TAG:-latest}
    build:
      context: ./discogs
      dockerfile: Dockerfile.web
    environment:
      FPM_HOST: discogs
    depends_on:
      - discogs
    restart: unless-stopped

  reverb:
    image: ghcr.io/nikander777/mz-main:${MAIN_TAG:-latest}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      <<: *laravel-env
      APP_KEY: ${MAIN_APP_KEY}
      APP_URL: ${MAIN_APP_URL}
      DB_DATABASE: ${MAIN_DB_DATABASE}
    # Shared storage с main — нужно для доступа к public/storage/shipments/*
    # (PDF этикеток, QR PNG) при отправке broadcast'ов и в очередях.
    volumes:
      - main_storage:/var/www/html/storage
    depends_on:
      - main
    restart: unless-stopped

  main-queue:
    image: ghcr.io/nikander777/mz-main:${MAIN_TAG:-latest}
    command: php artisan queue:work --tries=3 --timeout=120
    environment:
      <<: *laravel-env
      APP_KEY: ${MAIN_APP_KEY}
      APP_URL: ${MAIN_APP_URL}
      DB_DATABASE: ${MAIN_DB_DATABASE}
    # Shared storage с main — критично для queue worker'а: без него notification'ы
    # с inline QR (через $message->embed путь к файлу) не находят PNG, attachment'ы
    # из storage не отправляются, отложенная обработка файлов ломается.
    volumes:
      - main_storage:/var/www/html/storage
    depends_on:
      - main
    restart: unless-stopped

  main-scheduler:
    image: ghcr.io/nikander777/mz-main:${MAIN_TAG:-latest}
    command: php artisan schedule:work
    environment:
      <<: *laravel-env
      APP_KEY: ${MAIN_APP_KEY}
      APP_URL: ${MAIN_APP_URL}
      DB_DATABASE: ${MAIN_DB_DATABASE}
    # Shared storage с main — scheduled job'ы могут читать/писать те же файлы.
    volumes:
      - main_storage:/var/www/html/storage
    depends_on:
      - main
    restart: unless-stopped

  discogs-queue:
    image: ghcr.io/nikander777/mz-discogs:${DISCOGS_TAG:-latest}
    command: php artisan queue:work --tries=3 --timeout=120
    environment:
      <<: *laravel-env
      APP_KEY: ${DISCOGS_APP_KEY}
      APP_URL: ${DISCOGS_APP_URL}
      DB_DATABASE: ${DISCOGS_DB_DATABASE}
    depends_on:
      - discogs
    restart: unless-stopped

  nuxt:
    image: ghcr.io/nikander777/mz-nuxt:${NUXT_TAG:-latest}
    build:
      context: ./nuxt
      dockerfile: Dockerfile
      args:
        LARAVEL_URL: ${NUXT_LARAVEL_URL:-http://main-web}
        BACKEND_BASE_URL: ${NUXT_BACKEND_BASE_URL:-http://main-web}
        DISCOGS_BASE_URL: ${NUXT_DISCOGS_BASE_URL:-http://discogs-web}
        DISCOGS_API_TOKEN: ${DISCOGS_API_TOKEN:-placeholder}
        REVERB_APP_KEY: ${REVERB_APP_KEY:-placeholder}
        REVERB_HOST: ${REVERB_HOST:-localhost}
        REVERB_PORT: ${REVERB_PORT:-8080}
        REVERB_SCHEME: ${REVERB_SCHEME:-http}
        NUXT_PUBLIC_YMAPS_API_KEY: ${NUXT_PUBLIC_YMAPS_API_KEY:-00000000-0000-0000-0000-000000000000}
    environment:
      NODE_ENV: production
      LARAVEL_URL: ${NUXT_LARAVEL_URL}
      BACKEND_BASE_URL: ${NUXT_BACKEND_BASE_URL}
      DISCOGS_BASE_URL: ${NUXT_DISCOGS_BASE_URL}
      DISCOGS_API_TOKEN: ${DISCOGS_API_TOKEN}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT}
      REVERB_SCHEME: ${REVERB_SCHEME}
      NUXT_PUBLIC_YMAPS_API_KEY: ${NUXT_PUBLIC_YMAPS_API_KEY}
      NUXT_PUBLIC_SANCTUM_BASE_URL: ${NUXT_PUBLIC_SANCTUM_BASE_URL}
      NUXT_PUBLIC_LARAVEL_URL: ${NUXT_PUBLIC_LARAVEL_URL}
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL}
      # Раздел Hi-Fi. Значение public-конфига переопределяется на рантайме,
      # пересборка образа не нужна — достаточно force-recreate контейнера.
      # Должен совпадать с MZ_FEATURE_HIFI бэкенда, иначе меню и витрина
      # разъедутся (создать/продать всё равно не даст бэкенд).
      NUXT_PUBLIC_FEATURE_HIFI: ${MZ_FEATURE_HIFI:-false}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PUBLIC_REVERB_HOST: ${NUXT_PUBLIC_REVERB_HOST}
      NUXT_PUBLIC_REVERB_PORT: ${NUXT_PUBLIC_REVERB_PORT}
      NUXT_PUBLIC_REVERB_SCHEME: ${NUXT_PUBLIC_REVERB_SCHEME}
      NUXT_PUBLIC_REVERB_APP_KEY: ${NUXT_PUBLIC_REVERB_APP_KEY}
      NUXT_PUBLIC_SANCTUM_CLIENT_INITIAL_REQUEST: ${NUXT_PUBLIC_SANCTUM_CLIENT_INITIAL_REQUEST}
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    # EDGE_HTTP_PORT/EDGE_HTTPS_PORT задаются в .env.
    # По умолчанию edge слушает 80/443 на всех интерфейсах (голый stage).
    # Если на хосте стоит Caddy/Nginx, поставь 127.0.0.1:8080:80 и пусто для 443.
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/edge/certs:/etc/nginx/certs:ro
    depends_on:
      - nuxt
      - main-web
      - discogs-web
      - reverb
    restart: unless-stopped

  # Legacy MySQL — поднимается только под профилем `legacy` для разовой миграции старых данных.
  # Запуск: docker compose -f compose.stage.yml --profile legacy up -d legacy-mysql
  # Контейнер живёт только во внутренней docker-сети (никаких publish-портов).
  # См. DEPLOY.md раздел 14 «Перенос legacy-данных».
  legacy-mysql:
    image: mysql:8.0
    profiles: ["legacy"]
    command: >
      --default-authentication-plugin=mysql_native_password
      --max-allowed-packet=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${LEGACY_DB_PASSWORD}
      MYSQL_DATABASE: ${LEGACY_DB_DATABASE:-mz}
    volumes:
      - legacy_mysql_data:/var/lib/mysql
      - ./legacy:/dump:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${LEGACY_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

volumes:
  pg_data:
  redis_data:
  meili_data:
  main_storage:
  discogs_storage:
  legacy_mysql_data:
