# VM-1 «edge»: reverse-proxy, Nuxt SSR, web-sidecar'ы Laravel.
# Общается с VM-2 (queue/redis/reverb) и VM-3 (postgres/meili) по приватной сети.
#
# Требуемые env (см. .env.prod.example + .env.vm1):
#   VM2_HOST, VM3_HOST — IP/hostname в приватной сети
name: muzilla-edge

x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: ${VM3_HOST}
  DB_PORT: 5432
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  REDIS_HOST: ${VM2_HOST}
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  # Время жизни сессии, минуты. Дефолт Laravel — 120 (2 часа): для маркетплейса
  # это значит разлогин между заходами. Сессии лежат в Redis с TTL по этому
  # значению, поэтому его рост увеличивает и объём ключей сессий.
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_EXPIRE_ON_CLOSE: ${SESSION_EXPIRE_ON_CLOSE:-false}
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  SCOUT_DRIVER: meilisearch
  MEILISEARCH_HOST: http://${VM3_HOST}:7700
  MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
  # Драйвер каталога discogs: database (Postgres) | meili. Флипается через .env.
  DISCO_CATALOG_DRIVER: ${DISCO_CATALOG_DRIVER:-database}
  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: ${VM2_HOST}
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  DISCOGS_API_TOKEN: ${DISCOGS_API_TOKEN}
  # Personal access token discogs.com (для DiscogsApiService → api.discogs.com).
  # Без него все запросы получают 429/401. Лежит отдельно от внутреннего
  # DISCOGS_API_TOKEN, который используется для middleware api.token.
  DISCOGS_USER_TOKEN: ${DISCOGS_USER_TOKEN}
  # ApiTokenMiddleware в discogs сравнивает Bearer с INTERNAL_API_TOKEN.
  # Nuxt Nitro (server/utils/api.ts) шлёт DISCOGS_API_TOKEN — поэтому
  # на стороне discogs это значение должно совпадать. Используем общий.
  INTERNAL_API_TOKEN: ${DISCOGS_API_TOKEN}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}
  SESSION_DOMAIN: ${SESSION_DOMAIN}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  # S3 Media Storage (Timeweb Cloud) — нужно FPM для генерации URL в API ответах
  S3_MEDIA_KEY: ${S3_MEDIA_KEY}
  S3_MEDIA_SECRET: ${S3_MEDIA_SECRET}
  S3_MEDIA_REGION: ${S3_MEDIA_REGION:-ru-1}
  S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
  S3_MEDIA_ENDPOINT: ${S3_MEDIA_ENDPOINT}
  S3_MEDIA_URL: ${S3_MEDIA_URL}
  S3_MEDIA_PATH_STYLE: ${S3_MEDIA_PATH_STYLE:-true}
  # Image Processing
  IMAGE_DISK: ${IMAGE_DISK:-s3-media}
  IMAGE_DRIVER: ${IMAGE_DRIVER:-gd}
  IMAGE_WEBP_QUALITY: ${IMAGE_WEBP_QUALITY:-85}
  # Super Admin для ProductionSeeder/SuperAdminSeeder. Значения держим в
  # /opt/muzilla/.env на VM (gitignored) — здесь только маппинг.
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PHONE: ${ADMIN_PHONE}
  ADMIN_USERNAME: ${ADMIN_USERNAME}
  ADMIN_NAME: ${ADMIN_NAME}
  ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
  ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  # SMS-провайдер (sms4b.ru) — used main для регистрации/восстановления.
  SMS_PROVIDER: ${SMS_PROVIDER}
  SMS4B_TOKEN: ${SMS4B_TOKEN}
  SMS4B_SENDER: ${SMS4B_SENDER}
  # SMTP (mail.netangels.ru) — main кладёт email-уведомления в очередь;
  # фактическая отправка идёт из main-queue на VM-2 (тот же образ, тот же env).
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-mail.netangels.ru}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@muzilla.ru}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Muzilla}
  # Базовый URL фронтенда — используется в ссылках внутри email-шаблонов.
  APP_FRONTEND_URL: ${APP_FRONTEND_URL}

  # === НКО МОНЕТА: MerchantAPI, регистрация продавцов ЮЛ/ИП ===
  # Анкета продавца из ЛК уходит в БОЕВОЙ ЛК2 «ООО М9 ЛК Клиенты»
  # (unitId=22938995): CreateProfile в группу «Зарегистрированные»,
  # затем перевод в «Активные» и CreateAccount по счёту-прототипу.
  # Без этих переменных MerchantAPI падает на «не задан MONETA_UNIT_REGISTERED»,
  # анкета никуда не уходит, и продавец не проходит гейт каталога
  # (MZ_REQUIRE_MONETA_APPROVAL) — значения держим в /opt/muzilla/.env.
  MONETA_API_URL: ${MONETA_API_URL:-https://www.moneta.ru}
  MONETA_USERNAME: ${MONETA_USERNAME}
  MONETA_PASSWORD: ${MONETA_PASSWORD}
  MONETA_UNIT_ROOT: ${MONETA_UNIT_ROOT}
  MONETA_UNIT_REGISTERED: ${MONETA_UNIT_REGISTERED}
  MONETA_UNIT_ACTIVE: ${MONETA_UNIT_ACTIVE}
  MONETA_UNIT_WITHOUT_AGREEMENT: ${MONETA_UNIT_WITHOUT_AGREEMENT}
  MONETA_ACCOUNT_PROTOTYPE: ${MONETA_ACCOUNT_PROTOTYPE}
  MONETA_MERCHANT_PAYMENT_PASSWORD: ${MONETA_MERCHANT_PAYMENT_PASSWORD}
  # Коллбеки НКО об изменении профиля/договора/счетов продавца.
  # Без секрета эндпоинт /api/webhook/moneta/merchant закрыт (503).
  MONETA_MERCHANT_WEBHOOK_URL: ${MONETA_MERCHANT_WEBHOOK_URL}
  MONETA_MERCHANT_WEBHOOK_SECRET: ${MONETA_MERCHANT_WEBHOOK_SECRET}
  # Перепроверка коллбека в НКО вместо подписи: «код проверки целостности
  # данных» в интерфейсе ЛК2 не находится, и без этого флага онбординг
  # продавцов был бы закрыт наглухо (эндпоинт отвечает 503).
  MONETA_MERCHANT_WEBHOOK_VERIFY_VIA_API: ${MONETA_MERCHANT_WEBHOOK_VERIFY_VIA_API:-true}
  MONETA_WEBHOOK_ALLOWED_IPS: ${MONETA_WEBHOOK_ALLOWED_IPS}
  # ЛК1 «ООО М9 ЛК Счета» — счета площадки. Нужен, пока часть заказов
  # доживает на историческом драйвере moneta (order_payments.provider).
  MONETA_MERCHANT_ID: ${MONETA_MERCHANT_ID}
  MONETA_API_LOGIN: ${MONETA_API_LOGIN}
  MONETA_API_KEY: ${MONETA_API_KEY}
  MONETA_SECRET_KEY: ${MONETA_SECRET_KEY}
  MONETA_ACCOUNT_ID: ${MONETA_ACCOUNT_ID}
  MONETA_TRANSIT_ACCOUNT: ${MONETA_TRANSIT_ACCOUNT}
  MONETA_COMMISSION_ACCOUNT: ${MONETA_COMMISSION_ACCOUNT}
  MONETA_SECURITY_ACCOUNT: ${MONETA_SECURITY_ACCOUNT}
  MONETA_PAYMENT_PASSWORD: ${MONETA_PAYMENT_PASSWORD}
  MONETA_TEST_MODE: ${MONETA_TEST_MODE:-false}
  MONETA_USE_STUB: ${MONETA_USE_STUB:-false}
  MONETA_WEBHOOK_URL: ${MONETA_WEBHOOK_URL}
  MONETA_SUCCESS_URL: ${MONETA_SUCCESS_URL}
  MONETA_FAIL_URL: ${MONETA_FAIL_URL}
  # Имена атрибутов профиля НКО для налогового режима и ставки НДС.
  # Пусто = не отправлять (справочник атрибутов НКО не опубликован,
  # нераспознанный ключ отбивает весь EditProfile).
  MONETA_ATTR_TAX_REGIME: ${MONETA_ATTR_TAX_REGIME}
  MONETA_ATTR_VAT_CODE: ${MONETA_ATTR_VAT_CODE}

  # === Гейт каталога: товары видны только после одобрения анкеты НКО ===
  MZ_REQUIRE_MONETA_APPROVAL: ${MZ_REQUIRE_MONETA_APPROVAL:-true}

  # === Платежи: касса ПА ООО «ПЭЙ ЭНИ ВЭЙ» (54-ФЗ) ===
  # ⚠️ PAYMENTS_DRIVER здесь НАМЕРЕННО без значения по умолчанию `bpa`:
  # переключение включает боевой приём денег и фискализацию. Включать явно
  # в .env на сервере и только после того, как:
  #   1) продавцы зарегистрированы в НКО и у них реальные счета 40821
  #      (сейчас в базе фиктивные — боевая касса их отвергнет);
  #   2) заполнен PAYMENTS_PLATFORM_ACCOUNT — счёт площадки для строки
  #      доставки, без него сборка чека падает;
  #   3) подняты queue и scheduler: подтверждение холдов, сверка операций
  #      и разблокировка выплат живут в фоновых джобах.
  PAYMENTS_DRIVER: ${PAYMENTS_DRIVER:-moneta}
  BPA_KEY: ${BPA_KEY}
  BPA_SECRET: ${BPA_SECRET}
  BPA_CREDIT_ACCOUNT: ${BPA_CREDIT_ACCOUNT}
  BPA_DEBIT_ACCOUNT: ${BPA_DEBIT_ACCOUNT}
  BPA_API_URL: ${BPA_API_URL:-https://bpa.payanyway.ru/api}
  BPA_ASSISTANT_URL: ${BPA_ASSISTANT_URL:-https://www.payanyway.ru/assistant.htm}
  BPA_USE_STUB: ${BPA_USE_STUB:-false}
  BPA_QR_TTL: ${BPA_QR_TTL:-30}
  # Уведомления агрегатора подписи НЕ имеют — секрет в пути роута
  # /api/webhook/bpa/{secret}; пусто = эндпоинт закрыт (503).
  BPA_WEBHOOK_SECRET: ${BPA_WEBHOOK_SECRET}
  BPA_WEBHOOK_ALLOWED_IPS: ${BPA_WEBHOOK_ALLOWED_IPS}
  BPA_WEBHOOK_VERIFY_VIA_API: ${BPA_WEBHOOK_VERIFY_VIA_API:-true}
  BPA_ALLOWLIST_BUYER_IDS: ${BPA_ALLOWLIST_BUYER_IDS}
  BPA_ALLOWLIST_SELLER_IDS: ${BPA_ALLOWLIST_SELLER_IDS}
  PAYMENTS_PLATFORM_ACCOUNT: ${PAYMENTS_PLATFORM_ACCOUNT}
  PAYMENTS_PLATFORM_INN: ${PAYMENTS_PLATFORM_INN}
  PAYMENTS_PLATFORM_NAME: ${PAYMENTS_PLATFORM_NAME:-OOO M9}
  PAYMENTS_PLATFORM_PHONE: ${PAYMENTS_PLATFORM_PHONE}


  # === Каталог товаров: meili|database (откат — database) ===
  MZ_CATALOG_DRIVER_PRODUCTS: ${MZ_CATALOG_DRIVER_PRODUCTS:-database}
  # Раздел Hi-Fi (config/features.php). Выключен на старте: логистика под
  # крупногабаритные товары не готова. Парный флаг фронта — у сервиса nuxt.
  MZ_FEATURE_HIFI: ${MZ_FEATURE_HIFI:-false}

  # === Доставка ===
  # Перевозчик по умолчанию (config/delivery.php) — подстановка ПВЗ в новый
  # лот, дефолт карты на чекауте. Смена значения не отключает Почту России.
  DELIVERY_DEFAULT_CARRIER: ${DELIVERY_DEFAULT_CARRIER:-cdek}
  # СДЭК API v2 — ПВЗ на карте, тарифы, заявки, трекинг. Каталог ПВЗ
  # синхронизируется командой cdek:sync-pickup-points (крон 04:00), карта
  # читает точки bbox-запросом. Боевые креды и CDEK_SANDBOX=false — в .env
  # на сервере (в git не коммитятся).
  CDEK_ACCOUNT: ${CDEK_ACCOUNT}
  CDEK_SECURE: ${CDEK_SECURE}
  CDEK_SANDBOX: ${CDEK_SANDBOX:-true}
  CDEK_BASE_URL: ${CDEK_BASE_URL:-}
  CDEK_TIMEOUT: ${CDEK_TIMEOUT:-30}
  CDEK_FORCE_SHIPMENT_POINT: ${CDEK_FORCE_SHIPMENT_POINT:-}
  # Почта России — расчёт доставки, треки, QR-стикеры.
  RUSSIAN_POST_TOKEN: ${RUSSIAN_POST_TOKEN}
  RUSSIAN_POST_KEY: ${RUSSIAN_POST_KEY}
  RUSSIAN_POST_LOGIN: ${RUSSIAN_POST_LOGIN}
  RUSSIAN_POST_PASSWORD: ${RUSSIAN_POST_PASSWORD}
  RUSSIAN_POST_FORCE_OPS_CODE: ${RUSSIAN_POST_FORCE_OPS_CODE}

  # === DaData — подсказки адресов, городов, почтовых отделений ===
  DADATA_API_KEY: ${DADATA_API_KEY}
  DADATA_SECRET_KEY: ${DADATA_SECRET_KEY}

  # === VK ID OAuth (id.vk.ru) — server-side OAuth flow ===
  # Redirect URI должен быть прописан 1-в-1 в кабинете VK ID.
  VKID_CLIENT_ID: ${VKID_CLIENT_ID}
  VKID_CLIENT_SECRET: ${VKID_CLIENT_SECRET}
  VKID_REDIRECT_URI: ${VKID_REDIRECT_URI:-https://muzilla.ru/api/auth/vk/callback}

  # === Legacy MySQL — только на время миграции со старого портала ===
  # Задействован, когда на VM-3 поднят compose.legacy-mysql.yml. Вне миграции
  # переменные игнорируются (migrate-old:* не вызывается).
  LEGACY_DB_HOST: ${LEGACY_DB_HOST:-}
  LEGACY_DB_PORT: ${LEGACY_DB_PORT:-3306}
  LEGACY_DB_DATABASE: ${LEGACY_DB_DATABASE:-mz}
  LEGACY_DB_USERNAME: ${LEGACY_DB_USERNAME:-root}
  LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-}

services:
  main:
    image: ghcr.io/nikander777/mz-main:${MAIN_TAG:-latest}
    environment:
      <<: *laravel-env
      APP_KEY: ${MAIN_APP_KEY}
      APP_URL: ${MAIN_APP_URL}
      DB_DATABASE: ${MAIN_DB_DATABASE}
      DISCOGS_DB_HOST: ${VM3_HOST}
      DISCOGS_DB_DATABASE: ${MAIN_DISCOGS_DB_DATABASE}
      DISCOGS_DB_USERNAME: ${POSTGRES_USER}
      DISCOGS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # HTTP-прокси main → discogs (поиск дискографии, карточка релиза,
      # выбор релиза для товара). Без него config services.discogs.api_url
      # падает в дефолт http://localhost:8001 и весь /api/discogs/* отдаёт 500.
      DISCOGS_API_URL: http://discogs-web
    volumes:
      - main_storage:/var/www/html/storage
    restart: unless-stopped

  main-web:
    image: ghcr.io/nikander777/mz-main-web:${MAIN_TAG:-latest}
    environment:
      FPM_HOST: main
    depends_on: [main]
    restart: unless-stopped

  discogs:
    image: ghcr.io/nikander777/mz-discogs:${DISCOGS_TAG:-latest}
    environment:
      <<: *laravel-env
      APP_KEY: ${DISCOGS_APP_KEY}
      APP_URL: ${DISCOGS_APP_URL}
      DB_DATABASE: ${DISCOGS_DB_DATABASE}
    volumes:
      - discogs_storage:/var/www/html/storage
    restart: unless-stopped

  discogs-web:
    image: ghcr.io/nikander777/mz-discogs-web:${DISCOGS_TAG:-latest}
    environment:
      FPM_HOST: discogs
    depends_on: [discogs]
    restart: unless-stopped

  nuxt:
    image: ghcr.io/nikander777/mz-nuxt:${NUXT_TAG:-latest}
    environment:
      NODE_ENV: production
      LARAVEL_URL: http://main-web
      BACKEND_BASE_URL: ${NUXT_BACKEND_BASE_URL}
      DISCOGS_BASE_URL: http://discogs-web
      DISCOGS_API_TOKEN: ${DISCOGS_API_TOKEN}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_HOST: ${PUBLIC_HOST}
      REVERB_PORT: 443
      REVERB_SCHEME: https
      NUXT_PUBLIC_YMAPS_API_KEY: ${NUXT_PUBLIC_YMAPS_API_KEY}
      # Override публичного runtime-config: переопределяет build-time
      # дефолты apiUrl/apiBase из nuxt.config.ts. Без них в client-bundle
      # летит fallback http://main-web (см. nuxt/Dockerfile ARG).
      NUXT_PUBLIC_API_URL: ${NUXT_BACKEND_BASE_URL}
      NUXT_PUBLIC_API_BASE: ${NUXT_BACKEND_BASE_URL}
      NUXT_PUBLIC_LARAVEL_URL: ${NUXT_BACKEND_BASE_URL}
      # Раздел Hi-Fi. Должен совпадать с MZ_FEATURE_HIFI бэкенда (vm2).
      NUXT_PUBLIC_FEATURE_HIFI: ${MZ_FEATURE_HIFI:-false}
      # nuxt-auth-sanctum зашивает baseUrl из process.env.LARAVEL_URL во время
      # build (это http://main-web — внутренний docker host). Для client-side
      # cookies Sanctum должен ходить на public-домен → подменяем через
      # NUXT_PUBLIC_SANCTUM_BASE_URL (override уровня runtimeConfig.public.sanctum).
      NUXT_PUBLIC_SANCTUM_BASE_URL: ${NUXT_BACKEND_BASE_URL}
      # Reverb (WebSocket) — те же грабли: nuxt.config.ts process.env.REVERB_*
      # фиксируется build-time. NUXT_PUBLIC_REVERB_* override на runtime.
      NUXT_PUBLIC_REVERB_HOST: ${REVERB_HOST}
      NUXT_PUBLIC_REVERB_PORT: ${REVERB_PORT}
      NUXT_PUBLIC_REVERB_SCHEME: ${REVERB_SCHEME}
      NUXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY}
      # Private runtimeConfig — apiToken/apiBaseUrl используются Nitro
      # proxy (server/utils/api.ts) для запросов в discogs FPM. Build-time
      # дефолт apiToken=mbrainz-FSzz-3333 (несовпадает с INTERNAL_API_TOKEN),
      # поэтому Nitro шлёт неверный Bearer → 401. Override через NUXT_*.
      NUXT_API_TOKEN: ${DISCOGS_API_TOKEN}
      NUXT_API_BASE_URL: http://discogs-web
      # Node — один поток на процесс: SSR каталога и дискографии упирается в
      # ядро задолго до памяти. Держим несколько реплик (edge балансирует их
      # перерезолвом имени nuxt через встроенный DNS Docker) и подрезаем heap:
      # с дефолтными ~2 ГБ процесс перед смертью полчаса молотит GC и отдаёт
      # 502, с лимитом — быстро падает и перезапускается.
      NODE_OPTIONS: ${NUXT_NODE_OPTIONS:---max-old-space-size=1024}
    deploy:
      replicas: ${NUXT_REPLICAS:-3}
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # reverb живёт на VM-2, nginx ходит туда по имени
      - "reverb:${VM2_HOST}"
    depends_on: [nuxt, main-web, discogs-web]
    restart: unless-stopped

volumes:
  main_storage:
  discogs_storage:
